<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GMP Quest · Move Your Body — Sia</title>
<!--
  GMP Quest · 게임형 팝송 영어 (듀오링고 스타일)
  - 데이터는 스크립트 맨 위 LESSON_DATA 하나만 바꾸면 다른 곡으로 교체됩니다.
  - 진행 기록은 localStorage 키 gmp_quest_v1 에 저장됩니다 (곡별로 song.id 아래 누적).
-->
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --green:#58CC02;--green-d:#46A302;--green-l:#D7FFB8;
  --blue:#1CB0F6;--blue-d:#1899D6;--blue-l:#DDF4FF;
  --red:#FF4B4B;--red-d:#EA2B2B;--red-l:#FFDFE0;
  --yellow:#FFC800;--yellow-d:#E5A500;--yellow-l:#FFF5C2;
  --purple:#CE82FF;--purple-d:#A560EB;
  --gray:#E5E5E5;--gray-d:#AFAFAF;--text:#3C3C3C;--sub:#777;--bg:#FFFFFF;
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#F7F7F7;color:var(--text);font-size:16px;line-height:1.5}
.app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative}
.screen{display:none;flex:1;flex-direction:column}
.screen.active{display:flex}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ===== 3D 버튼 ===== */
.btn{display:block;width:100%;padding:14px 18px;border-radius:16px;font-size:16px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--green);border-bottom:4px solid var(--green-d);transition:transform .05s,filter .1s}
.btn:active{transform:translateY(3px);border-bottom-width:1px}
.btn.disabled{background:var(--gray);border-bottom-color:#CFCFCF;color:var(--gray-d);pointer-events:none}
.btn.blue{background:var(--blue);border-bottom-color:var(--blue-d)}
.btn.red{background:var(--red);border-bottom-color:var(--red-d)}
.btn.white{background:#fff;color:var(--blue);border:2px solid var(--gray);border-bottom:4px solid var(--gray)}
.btn.yellow{background:var(--yellow);border-bottom-color:var(--yellow-d);color:#5a4100}
.btn.sm{padding:10px 14px;font-size:14px;width:auto;display:inline-block}

/* ===== 상단 바 ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:2px solid var(--gray);position:sticky;top:0;background:#fff;z-index:5}
.stat{display:flex;align-items:center;gap:5px;font-weight:800;font-size:15px}
.stat.streak{color:#FF9600}.stat.xp{color:var(--yellow-d)}.stat.heart{color:var(--red)}.stat.lv{color:var(--purple-d)}
.stat small{font-size:11px;font-weight:700;color:var(--sub)}

/* ===== 경로 화면 ===== */
.unit-card{margin:16px;background:linear-gradient(135deg,#1CB0F6,#8C6CFF);border-radius:20px;padding:18px 20px;color:#fff;box-shadow:0 4px 0 #1484b8}
.unit-card .u-tag{font-size:11px;font-weight:800;letter-spacing:.1em;opacity:.85;text-transform:uppercase}
.unit-card h1{font-size:21px;font-weight:900;margin:4px 0 2px}
.unit-card p{font-size:13px;opacity:.92}
.unit-card .u-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.unit-card .u-btn{background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.6);color:#fff;font-weight:800;font-size:13px;padding:8px 12px;border-radius:12px}
.goal{margin:0 16px 8px;background:#fff;border:2px solid var(--gray);border-radius:16px;padding:12px 14px}
.goal .g-top{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--sub)}
.goal .g-top b{color:var(--text)}
.bar{height:14px;background:var(--gray);border-radius:10px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--yellow);border-radius:10px;transition:width .5s}
.bar.green>i{background:var(--green)}
.path{padding:10px 0 110px;position:relative}
.node-wrap{display:flex;justify-content:center;margin:14px 0;position:relative}
.node{width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;position:relative;background:var(--gray);border-bottom:7px solid #BDBDBD;transition:transform .08s}
.node:active{transform:translateY(4px);border-bottom-width:3px}
.node.done{background:var(--green);border-bottom-color:var(--green-d)}
.node.active{background:var(--blue);border-bottom-color:var(--blue-d);animation:pulse 1.6s infinite}
.node.boss{width:90px;height:90px;font-size:36px}
.node.boss.active{background:var(--purple);border-bottom-color:var(--purple-d)}
.node.boss.done{background:var(--yellow);border-bottom-color:var(--yellow-d)}
.node.locked{filter:grayscale(1);opacity:.7}
.node .crown{position:absolute;top:-10px;right:-8px;font-size:22px;filter:drop-shadow(0 1px 0 #0003)}
.node .lock{position:absolute;bottom:-4px;right:-2px;font-size:16px}
.node-label{position:absolute;left:50%;top:50%;transform:translate(70px,-50%);width:150px;font-size:13px;font-weight:800;color:var(--sub);line-height:1.3}
.node-label b{display:block;color:var(--text);font-size:14px}
.node-wrap.left{justify-content:flex-start;padding-left:70px}.node-wrap.right{justify-content:flex-end;padding-right:70px}
.node-wrap.right .node-label{left:auto;right:50%;transform:translate(-70px,-50%);text-align:right}
.start-bubble{position:absolute;top:-46px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--gray);border-radius:12px;padding:5px 12px;font-size:12px;font-weight:900;color:var(--green);white-space:nowrap;animation:bob 1.2s infinite}
.start-bubble:after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:#fff;border-right:2px solid var(--gray);border-bottom:2px solid var(--gray);transform:translateX(-50%) rotate(45deg)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(28,176,246,.45)}60%{box-shadow:0 0 0 14px rgba(28,176,246,0)}}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-4px)}}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;border-top:2px solid var(--gray);display:flex;justify-content:space-around;padding:10px 0 14px;z-index:5}
.bottom-nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--sub);padding:4px 14px;border-radius:12px}
.bottom-nav button span{font-size:24px}
.bottom-nav button.on{color:var(--blue);background:var(--blue-l)}

/* ===== 레슨 화면 ===== */
.lesson-top{display:flex;align-items:center;gap:12px;padding:14px 16px}
.lesson-top .x{font-size:26px;color:var(--gray-d);font-weight:800;line-height:1;padding:4px 8px}
.lesson-top .bar{flex:1;margin:0;height:16px}
.lesson-top .hearts{color:var(--red);font-weight:900;font-size:15px;min-width:40px;text-align:right}
.ex{flex:1;padding:6px 20px 20px;display:flex;flex-direction:column}
.ex-type{font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.ex h2{font-size:21px;font-weight:900;margin-bottom:14px;line-height:1.35}
.mascot-row{display:flex;gap:10px;align-items:flex-end;margin-bottom:16px}
.mascot{font-size:52px;line-height:1}
.bubble{position:relative;background:#fff;border:2px solid var(--gray);border-radius:14px;padding:10px 14px;font-size:18px;font-weight:700;flex:1;line-height:1.4}
.bubble:before{content:"";position:absolute;left:-9px;top:20px;width:12px;height:12px;background:#fff;border-left:2px solid var(--gray);border-bottom:2px solid var(--gray);transform:rotate(45deg)}
.bubble .ko{display:block;font-size:14px;color:var(--sub);font-weight:600;margin-top:4px}
.spk{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:14px;background:var(--blue);border-bottom:4px solid var(--blue-d);color:#fff;font-size:20px;flex-shrink:0}
.spk.big{flex:1;width:auto;height:96px;font-size:44px;border-radius:20px}
.spk.slow{background:#fff;color:var(--blue);border:2px solid var(--gray);border-bottom:4px solid var(--gray);font-size:13px;font-weight:800;width:auto;height:96px;flex:0 0 auto;padding:0 14px;border-radius:20px}
.spk.playing{filter:brightness(1.15)}
.spk.mini{width:30px;height:30px;font-size:14px;vertical-align:middle;border-bottom-width:2px;border-radius:8px}
.options{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;border:2px solid var(--gray);border-bottom:4px solid var(--gray);border-radius:14px;background:#fff;font-size:17px;font-weight:700;color:var(--text);transition:all .1s}
.opt .n{width:28px;height:28px;border-radius:8px;border:2px solid var(--gray);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--sub);flex-shrink:0}
.opt.sel{border-color:var(--blue);background:var(--blue-l);color:var(--blue-d)}
.opt.sel .n{border-color:var(--blue);color:var(--blue-d)}
.opt.ok{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
.opt.no{border-color:var(--red);background:var(--red-l);color:var(--red-d)}
.opt:disabled{pointer-events:none}
.answer-line{min-height:62px;border-bottom:2px solid var(--gray);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0 12px;margin-bottom:18px;align-items:flex-start}
.answer-line.two{min-height:104px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{padding:10px 14px;border:2px solid var(--gray);border-bottom:4px solid var(--gray);border-radius:12px;background:#fff;font-size:16px;font-weight:700;color:var(--text);transition:transform .08s}
.tile:active{transform:translateY(2px)}
.tile.used{visibility:hidden}
.tile.placed{border-color:var(--blue);background:var(--blue-l);color:var(--blue-d)}
.typebox{width:100%;min-height:110px;border:2px solid var(--gray);border-radius:14px;padding:14px;font-size:18px;font-family:inherit;resize:none;outline:none;background:#F7F7F7;color:var(--text)}
.typebox:focus{border-color:var(--blue);background:#fff}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match-col{display:flex;flex-direction:column;gap:10px}
.mt{padding:14px 10px;border:2px solid var(--gray);border-bottom:4px solid var(--gray);border-radius:14px;background:#fff;font-size:15px;font-weight:700;min-height:58px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3}
.mt.sel{border-color:var(--blue);background:var(--blue-l);color:var(--blue-d)}
.mt.done{border-color:var(--gray);background:#F3F3F3;color:#BDBDBD;pointer-events:none}
.mt.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.blank-sentence{font-size:21px;font-weight:800;line-height:2;margin-bottom:18px;text-align:center}
.blank-slot{display:inline-block;min-width:110px;border-bottom:3px solid var(--gray-d);text-align:center;color:var(--blue-d);padding:0 6px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{padding:12px 18px;border:2px solid var(--gray);border-bottom:4px solid var(--gray);border-radius:14px;background:#fff;font-size:17px;font-weight:700}
.chip.sel{border-color:var(--blue);background:var(--blue-l);color:var(--blue-d)}
.speak-box{text-align:center;padding:10px 0}
.mic{width:120px;height:120px;border-radius:50%;background:var(--blue);border-bottom:6px solid var(--blue-d);color:#fff;font-size:50px;margin:16px auto;display:flex;align-items:center;justify-content:center}
.mic.rec{background:var(--red);border-bottom-color:var(--red-d);animation:pulse-red 1s infinite}
@keyframes pulse-red{0%,100%{box-shadow:0 0 0 0 rgba(255,75,75,.5)}60%{box-shadow:0 0 0 18px rgba(255,75,75,0)}}
.heard{font-size:14px;color:var(--sub);min-height:22px;margin-bottom:6px}
.hint-tip{font-size:13px;color:var(--sub);text-align:center;margin-top:10px}

.lesson-foot{padding:14px 20px 20px;border-top:2px solid var(--gray);background:#fff}
.feedback{display:none;padding:18px 20px 20px;border-top:2px solid var(--gray)}
.feedback.show{display:block}
.feedback.ok{background:var(--green-l)}.feedback.no{background:var(--red-l)}
.feedback h3{font-size:20px;font-weight:900;margin-bottom:4px}
.feedback.ok h3{color:var(--green-d)}.feedback.no h3{color:var(--red-d)}
.feedback p{font-size:15px;font-weight:600;margin-bottom:12px;color:#5a5a5a}
.feedback .ans{font-weight:800;color:var(--red-d)}
.feedback .tip{font-size:13px;color:#6b6b6b;background:rgba(255,255,255,.7);border-radius:10px;padding:8px 12px;margin-bottom:12px;line-height:1.5}
.feedback.ok .tip{color:#3f7a16}
.feedback.no .btn{background:var(--red);border-bottom-color:var(--red-d)}

/* ===== 결과/오버레이 ===== */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 24px}
.center .big{font-size:84px;line-height:1;margin-bottom:10px;animation:pop .5s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.center h1{font-size:26px;font-weight:900;color:var(--yellow-d);margin-bottom:6px}
.center p{color:var(--sub);font-weight:600;margin-bottom:22px}
.result-cards{display:flex;gap:10px;width:100%;margin-bottom:22px}
.rc{flex:1;border-radius:16px;padding:3px;color:#fff;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.rc div{background:#fff;border-radius:13px;padding:12px 6px;font-size:22px;font-weight:900;margin-top:4px}
.rc.y{background:var(--yellow)}.rc.y div{color:var(--yellow-d)}
.rc.g{background:var(--green)}.rc.g div{color:var(--green-d)}
.rc.b{background:var(--blue)}.rc.b div{color:var(--blue-d)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:22px;padding:26px 22px;max-width:380px;width:100%;text-align:center;animation:pop .4s}
.modal .big{font-size:70px;line-height:1;margin-bottom:8px}
.modal h2{font-size:22px;font-weight:900;margin-bottom:6px}
.modal p{color:var(--sub);font-weight:600;margin-bottom:18px;font-size:15px}
.modal .btn{margin-top:8px}

/* ===== 프로필 ===== */
.profile{padding:16px 16px 110px}
.pf-head{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--gray);border-radius:18px;padding:16px}
.pf-avatar{width:68px;height:68px;border-radius:50%;background:var(--purple);display:flex;align-items:center;justify-content:center;font-size:34px;border-bottom:5px solid var(--purple-d)}
.pf-head h2{font-size:19px;font-weight:900}
.pf-head p{font-size:13px;color:var(--sub);font-weight:700}
.pf-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.pf-box{border:2px solid var(--gray);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.pf-box span{font-size:26px}
.pf-box b{display:block;font-size:19px;font-weight:900}
.pf-box small{font-size:12px;color:var(--sub);font-weight:700}
.sec-title{font-size:17px;font-weight:900;margin:22px 0 10px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{border:2px solid var(--gray);border-radius:16px;padding:12px 6px;text-align:center}
.badge span{font-size:32px;display:block;filter:grayscale(1);opacity:.35}
.badge.on span{filter:none;opacity:1}
.badge b{display:block;font-size:12px;font-weight:800;margin-top:4px}
.badge small{font-size:10px;color:var(--sub);font-weight:700;line-height:1.2;display:block}
.lv-table{border:2px solid var(--gray);border-radius:16px;overflow:hidden}
.lv-row{display:flex;justify-content:space-between;padding:10px 14px;border-bottom:2px solid #F0F0F0;font-size:14px;font-weight:700;color:var(--sub)}
.lv-row:last-child{border-bottom:none}
.lv-row.cur{background:var(--purple);color:#fff}
.lv-row.past{color:var(--green-d)}
.share-box{margin-top:16px;border:2px solid var(--gray);border-radius:16px;padding:12px 14px}
.share-box pre{font-family:inherit;font-size:13px;white-space:pre-wrap;color:var(--text);line-height:1.7}
.note{font-size:12px;color:var(--sub);text-align:center;margin:14px 20px 0;line-height:1.6}
.vbanner{display:none;margin:0 16px 8px;background:var(--yellow-l);border:2px solid var(--yellow);border-radius:12px;padding:10px 12px;font-size:12px;color:#6b5200;font-weight:700;line-height:1.5}
/* Quest typography, lesson path and flashcards */
:root{--ink:#182b3e;--muted:#53677a;--line:#dce4ea;--teal:#006752;--paper:#f4f7f7}
body{background:#e8eeef;color:var(--ink)}
.app{box-shadow:0 0 60px #18304710}
.topbar{border-bottom:1px solid var(--line)}
.unit-card,.fc-card{isolation:isolate;position:relative;overflow:hidden;color:white;background:radial-gradient(ellipse at 108% -15%,#357f81 0%,transparent 56%),linear-gradient(125deg,#15233b,#253f53 74%);border:0;box-shadow:0 8px 20px #192d3e16}
.unit-card{padding:23px;border-radius:22px}
.unit-card h1{font:600 clamp(36px,10vw,52px)/1.1 Georgia,serif;letter-spacing:-.035em;margin:7px 0}
.unit-card p{max-width:35ch}
.unit-card .u-btn{background:#ffffff12;border:1px solid #ffffff5e;font-weight:600}
.unit-card .u-tag{color:#b9e4d7}
.flash-launch{display:flex;align-items:center;text-align:left;gap:12px;margin:0 16px 14px;padding:16px 18px;background:#e4f3ed;border:1px solid #b4d9c8;border-radius:17px;color:#174b3f}
.flash-launch strong,.flash-launch small{display:block}.flash-launch small{color:#47665b;font-size:12px;margin-top:2px}.flash-launch svg{width:30px;height:30px}.launch-arrow{margin-left:auto;font-size:22px}
.bottom-nav{padding:6px 3px max(6px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.bottom-nav button{padding:5px 6px;min-height:48px;flex:1;justify-content:center}.bottom-nav button span{font-size:20px}
.bottom-nav .on{color:#115d4e!important;background:#eaf4ef!important}
.path{padding:4px 18px 90px}.node-wrap,.node-wrap.left,.node-wrap.right{justify-content:stretch;padding:0;margin:0}
.node-wrap>div{display:flex;align-items:center;gap:15px;width:100%;padding:13px 0;border-bottom:1px solid var(--line)}
.node,.node.boss{flex:none;width:54px;height:54px;font-size:23px;border-bottom-width:3px}.node.active{animation:none}
.node-label,.node-wrap.right .node-label{position:static;transform:none;width:auto;text-align:left;line-height:1.45;min-width:0;font-weight:500;color:var(--muted)}
.node-label b{font-size:15px}.start-bubble{display:none}.node .crown{font-size:17px}
#scr-flash{padding:22px 20px 92px;background:linear-gradient(180deg,#fafbf9,#fff 66%);color:var(--ink)}
.fc-main{width:100%}.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fc-top h1{font-size:26px;letter-spacing:-.055em}.fc-song{color:var(--muted);font-size:14px;margin:4px 0 15px;line-height:1.6}
.fc-total{background:#e5f2ea;border-radius:22px;color:var(--teal);font-size:13px;font-weight:750;padding:5px 12px}
.fc-filter{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0 0 12px}
.fc-filter button,.fc-switch button,.fc-audio,.fc-action{border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:14px;font-weight:650;min-height:44px;background:white}
.fc-filter button{padding-inline:4px;white-space:nowrap}.fc-filter button[aria-pressed=true]{background:var(--ink);color:white;border-color:var(--ink)}
.fc-switch{display:flex;border-radius:13px;background:#ebf0f1;padding:3px;margin-bottom:16px}.fc-switch button{flex:1;background:transparent;border:0;color:#4c626b;min-height:38px}
.fc-switch button[aria-pressed=true]{background:white;color:#174c45;box-shadow:0 1px 4px #16273520}
.fc-meta{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:650}
.fc-progress{display:block;border:0;border-radius:8px;height:5px;width:100%;margin:8px 0 14px;overflow:hidden;background:#e5eceb;accent-color:var(--teal)}
.fc-progress::-webkit-progress-bar{background:#e5eceb}.fc-progress::-webkit-progress-value{background:#328978}

function load(){

  if(!d.songs[LESSON_DATA.song.id]) d.songs[LESSON_DATA.song.id] = { done:{}, xp:0 };
  return d;
}

function norm(s){ return String(s).toLowerCase().replace(/[’'".,!?;:\-—–]/g,'').replace(/\s+/g,' ').trim(); }
function words(en){ return en.replace(/[.,!?;:]+$/,'').split(' '); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function pick(a,n,exclude){ var pool=a.filter(function(x){ return !exclude || exclude.indexOf(x)<0; }); return shuffle(pool).slice(0,n); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  var mine = words(sent.en).map(norm);

  allSentences().forEach(function(s){ if(s!==sent) words(s.en).forEach(function(w){ var nw=norm(w); if(mine.indexOf(nw)<0 && pool.indexOf(w)<0 && nw.length>1) pool.push(w); }); });
  return pick(pool, n);
}

/* =====================================================================
   4. 문제 생성기
   ===================================================================== */
function exChoiceEn2Ko(sent, pool){ // 영어 듣고/보고 뜻 고르기
  var wrong = pick(pool.filter(function(s){ return s!==sent; }), 3).map(function(s){ return s.ko; });
  var opts = shuffle([sent.ko].concat(wrong));
  return { type:'choice', title:'이 문장의 뜻은?', text:sent.en, speak:sent.en, options:opts, answer:opts.indexOf(sent.ko), tip:sent.tip, en:sent.en };
}
function exChoiceKo2En(sent, pool){ // 뜻 보고 영어 고르기
  var wrong = pick(pool.filter(function(s){ return s!==sent; }), 3).map(function(s){ return s.en; });
  var opts = shuffle([sent.en].concat(wrong));
  return { type:'choice', title:'영어로 맞게 옮긴 것은?', text:sent.ko, options:opts, answer:opts.indexOf(sent.en), tip:sent.tip, en:sent.en, speakOptions:true };
}
function exTiles(sent){ // 단어 타일로 문장 만들기
  var w = words(sent.en);
  var extra = distractorWords(sent, w.length<=3 ? 3 : 2);
  return { type:'tiles', title:'이 문장을 영어로 만들어 보세요', text:sent.ko, tiles:shuffle(w.concat(extra)), en:sent.en, answerWords:w, tip:sent.tip };
}
function exListen(sent){ // 듣고 타일 배열
  var w = words(sent.en);
  var extra = distractorWords(sent, 2);
  return { type:'listen', title:'들리는 대로 문장을 만들어 보세요', tiles:shuffle(w.concat(extra)), en:sent.en, ko:sent.ko, answerWords:w, tip:sent.tip };
}
function exBlank(sent){ // 빈칸 (칩 선택)
  var w = words(sent.en);
  var cand = w.map(function(x,i){ return i; }).filter(function(i){ return norm(w[i]).length>2 && !/^(the|and|for|that|this|with|were|you|we)$/.test(norm(w[i])); });
  var bi = cand.length ? cand[Math.floor(Math.random()*cand.length)] : 0;
  var ans = w[bi];
  var vocabPool = LESSON_DATA.vocab.map(function(v){ return v.en; }).filter(function(v){ return v.indexOf(' ')<0 && norm(v)!==norm(ans); });
  var others = distractorWords(sent, 6).filter(function(x){ return norm(x)!==norm(ans); });
  var chips = shuffle([ans].concat(pick(vocabPool.concat(others), 2)));
  return { type:'blank', title:'빈칸에 알맞은 말은?', wordsArr:w, blankIdx:bi, chips:chips, answer:ans, ko:sent.ko, en:sent.en, tip:sent.tip };
}
function exType(sent){ // 타이핑 번역
  return { type:'type', title:'영어로 써 보세요', text:sent.ko, en:sent.en, tip:sent.tip };
}
function exDictation(sent){ // 듣고 받아쓰기
  return { type:'type', title:'들리는 대로 써 보세요', dictation:true, en:sent.en, ko:sent.ko, tip:sent.tip };
}
function exMatch(vocab){ // 짝 맞추기
  var pairs = pick(vocab, 5);
  return { type:'match', title:'짝을 맞춰 보세요', pairs:pairs, tip:'단어는 짝으로 외우면 오래 남아요. 소리도 함께 들어 보세요.' };
}
function exVocabChoice(v, vocab){
  var wrong = pick(vocab.filter(function(x){ return x!==v; }), 3).map(function(x){ return x.ko; });
  var opts = shuffle([v.ko].concat(wrong));
  return { type:'choice', title:'이 단어의 뜻은?', text:v.en, speak:v.en, options:opts, answer:opts.indexOf(v.ko), tip:v.en+' → '+v.pron, en:v.en };
}
function exSpeak(sent){
  return { type:'speak', title:'따라 말해 보세요', en:sent.en, ko:sent.ko, tip:sent.tip };
}

function buildLesson(L){
  var S = LESSON_DATA.sentences, E = LESSON_DATA.examples, V = LESSON_DATA.vocab, all = allSentences();
  var ex = [];
  if(L.build==='vocab'){
    var vs = shuffle(V);
    ex.push(exVocabChoice(vs[0],V), exVocabChoice(vs[1],V), exMatch(V), exVocabChoice(vs[2],V), exVocabChoice(vs[3],V), exMatch(V), exVocabChoice(vs[4],V), exChoiceEn2Ko(S[0], S));
  } else if(L.build==='group'){
    var main = S[L.g-1];
    var exs = E.filter(function(e){ return e.g===L.g; });
    ex.push(exChoiceEn2Ko(main, all), exTiles(main), exChoiceKo2En(exs[0], all), exBlank(exs[0]), exListen(main), exTiles(exs[1]), exBlank(exs[2]), exSpeak(main), exChoiceEn2Ko(exs[2], all));
  } else if(L.build==='business'){
    var es = shuffle(E);
    ex.push(exChoiceKo2En(es[0], E), exBlank(es[1]), exTiles(es[2]), exListen(es[3]), exChoiceEn2Ko(es[4], E), exBlank(es[5]), exTiles(es[6]), exSpeak(es[7]), exMatch(V), exChoiceKo2En(es[8], E));
  } else if(L.build==='boss'){
    var a = shuffle(all);
    ex.push(exListen(S[0]), exType(S[1]), exTiles(a[0]), exBlank(a[1]), exDictation(S[2]), exChoiceKo2En(a[2], all), exTiles(a[3]), exType(a[4].en.split(' ').length<=6 ? a[4] : S[0]), exListen(a[5]), exMatch(V), exSpeak(a[6]), exDictation(a[7].en.split(' ').length<=7 ? a[7] : S[1]));
  } else if(L.build==='practice'){
    var p = shuffle(all);
    ex.push(exChoiceEn2Ko(p[0], all), exTiles(p[1]), exBlank(p[2]), exListen(p[3]), exMatch(V), exChoiceKo2En(p[4], all), exSpeak(p[5]), exTiles(p[6]));
  }
  return ex;
}

/* =====================================================================
   5. 음성 (안드로이드 호환)
   ===================================================================== */
var synth = window.speechSynthesis || null;
var __voice = null, __voiceTried = 0;
function pickVoice(){
  if(!synth) return null;
  var vs = synth.getVoices(); if(!vs || !vs.length) return null;
  var en = vs.filter(function(v){ return (v.lang||'').replace('_','-').toLowerCase().indexOf('en')===0; });
  if(!en.length) return null;
  var us = en.filter(function(v){ return /en[-_]us/i.test(v.lang); });
  var pool = us.length ? us : en;
  var fem = ['samantha','victoria','allison','ava','zira','aria','jenny','joanna','salli','kendra','google us english','karen','moira','tessa','female','zoe'];
  var f = pool.filter(function(v){ var n=(v.name||'').toLowerCase(); return fem.some(function(x){ return n.indexOf(x)>=0; }); });
  return f[0] || pool[0];
}
function ensureVoice(){ if(!__voice) __voice = pickVoice(); return __voice; }
if(synth){ synth.onvoiceschanged = function(){ __voice = pickVoice(); checkVoiceBanner(); }; setTimeout(function(){ ensureVoice(); checkVoiceBanner(); }, 400); }
function checkVoiceBanner(){
  var b = document.getElementById('vbanner'); if(!b) return;
  if(!synth){ b.style.display='block'; b.textContent='이 브라우저는 음성 재생을 지원하지 않아요. 듣기 문제는 문장을 보여 드릴게요.'; return; }
  var vs = synth.getVoices(); if(!vs.length) return;
  if(!ensureVoice()){ b.style.display='block'; b.innerHTML='📢 기기에 <b>영어 음성</b>이 없어요. 안드로이드: 설정 → 일반 → 텍스트 음성 변환(TTS) → Google 음성 → 영어(미국) 설치. 듣기 문제는 문장을 보여 드릴게요.'; }
}
var __speakToken = 0;
function speak(text, rate, onend){
  if(!synth){ if(onend) onend(); return; }
  var tok = ++__speakToken;
  try { synth.cancel(); } catch(e){}
  setTimeout(function(){
    if(tok!==__speakToken) return;
    var u = new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=rate||0.95; u.pitch=1;
    var v = ensureVoice(); if(v) u.voice=v;
    var ended=false; function fin(){ if(!ended){ ended=true; if(onend) onend(); } }
    u.onend=fin; u.onerror=fin;
    synth.speak(u);
    setTimeout(fin, 1500 + text.length*120);
  }, 80);
}
var sequenceId = 0;
function speakSeq(list){
  var token = ++sequenceId;
  function next(index){
    if(token !== sequenceId || index >= list.length) return;
    speak(list[index], 0.95, function(){ setTimeout(function(){ next(index + 1); }, 350); });
  }
  next(0);
}
function stopSpeak(){
  sequenceId++;
  __speakToken++;
  if(synth) try { synth.cancel(); } catch(e){}
}
function spkBtn(text, cls, label, rate){
  return '<button class="spk '+(cls||'')+'" onclick="speakBtn(this,\''+esc(text).replace(/'/g,'\\\'')+'\','+(rate||0.95)+')">'+(label||'🔊')+'</button>';
}
function speakBtn(btn, text, rate){ btn.classList.add('playing'); speak(text, rate, function(){ btn.classList.remove('playing'); }); }

function tapMatch(side,i){
  var ex=currentEx(), M=G.matchState; var el=document.getElementById('m'+side+i);

  else { if(M.selR===i){ M.selR=-1; el.classList.remove('sel'); return; } if(M.selR>=0) document.getElementById('mR'+M.selR).classList.remove('sel'); M.selR=i; el.classList.add('sel'); }
  if(M.selL>=0 && M.selR>=0){
    var pair = ex.pairs.filter(function(p){ return p.en===M.left[M.selL]; })[0];
    var L=document.getElementById('mL'+M.selL), R=document.getElementById('mR'+M.selR);
    if(pair && pair.ko===M.right[M.selR]){
      L.classList.remove('sel'); R.classList.remove('sel'); L.classList.add('done'); R.classList.add('done'); M.donePairs++;
      if(M.donePairs===ex.pairs.length){ G.answer='done'; setTimeout(function(){ grade(true, M.miss>0 ? '짝을 '+M.miss+'번 헷갈렸지만 결국 다 맞췄어요! 헷갈린 단어는 다시 들어 보세요.' : null); }, 300); }
    } else {
      M.miss++; L.classList.add('shake'); R.classList.add('shake');
      setTimeout(function(){ L.classList.remove('sel','shake'); R.classList.remove('sel','shake'); }, 400);
    }
    M.selL=-1; M.selR=-1;
  }
}

var __rec=null;
function startRec(){
  var ex=currentEx(); var SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return;
  stopSpeak();
  var mic=document.getElementById('mic'), heard=document.getElementById('heard');
  if(__rec){ try{ __rec.stop(); }catch(e){} __rec=null; mic.classList.remove('rec'); return; }
  var r=new SR(); r.lang='en-US'; r.interimResults=false; r.maxAlternatives=3; __rec=r;
  mic.classList.add('rec'); heard.textContent='듣고 있어요… 말해 보세요';
  r.onresult=function(e){
    var best='', bestScore=0;
    for(var i=0;i<e.results[0].length;i++){ var t=e.results[0][i].transcript; var sc=similarity(t, ex.en); if(sc>bestScore){ bestScore=sc; best=t; } }
    heard.textContent='들린 말: "'+best+'"';
    G.spokeOK = bestScore>=0.6;
    setTimeout(function(){ grade(G.spokeOK, G.spokeOK ? '발음이 잘 전달됐어요! ('+Math.round(bestScore*100)+'% 일치)' : '들린 말과 문장이 달라요. 🔊를 다시 듣고 천천히 또박또박 말해 보세요.', true); }, 500);
  };
  r.onerror=function(e){ heard.textContent='마이크를 쓸 수 없어요 ('+e.error+'). 아래 버튼으로 넘어가도 돼요.'; mic.classList.remove('rec'); __rec=null; };
  r.onend=function(){ mic.classList.remove('rec'); __rec=null; };
  try{ r.start(); }catch(e){ heard.textContent='마이크를 시작할 수 없어요.'; }
}
function similarity(a,b){ var A=norm(a).split(' '), B=norm(b).split(' '); var hit=0; B.forEach(function(w){ if(A.indexOf(w)>=0) hit++; }); return hit/B.length; }
function skipSpeak(){ G.skipSpeak=true; grade(true, '괜찮아요. 다음에는 소리 내어 말해 보세요! (XP는 절반만)', true); }

function checkAnswer(){
  if(!G || document.getElementById('feedback').classList.contains('show')) return;
  var ex=currentEx();
  if(!ex) return;
  // Writing answers live in the textarea, unlike choices and word tiles.
  var typed='';
  if(ex.type==='type'){
    var field=document.getElementById('typebox');
    if(!field || !(typed=field.value.trim())) return;
    field.blur();
  } else if(G.answer===null || (Array.isArray(G.answer)&&!G.answer.length)){
    return;
  }
  var ok=false, note=null;
  if(ex.type==='choice'){ ok = G.answer===ex.answer;
    document.querySelectorAll('.opt').forEach(function(o,k){ o.disabled=true; if(k===ex.answer) o.classList.add('ok'); else if(k===G.answer) o.classList.add('no'); });
  }
  else if(ex.type==='tiles'||ex.type==='listen'){ var made=G.answer.map(function(i){ return ex.tiles[i]; }).join(' '); ok = norm(made)===norm(ex.en); if(!ok && norm(made).replace(/ /g,'')===norm(ex.en).replace(/ /g,'')) ok=true; }
  else if(ex.type==='blank'){ ok = norm(ex.chips[G.answer])===norm(ex.answer); }
  else if(ex.type==='type'){ var nv=norm(typed), ne=norm(ex.en); ok = nv===ne; if(!ok){ var alt = ne.replace(/\b(theyre|weve|lets|were)\b/g, function(m){ return {theyre:'they are', weve:'we have', lets:'let us', were:'we are'}[m]||m; }); if(nv===alt) ok=true; } if(!ok && typoClose(nv,ne)){ ok=true; note='오타가 하나 있지만 정답으로 인정! 정확한 문장: '+ex.en; } }
  grade(ok, note);
}
function typoClose(a,b){ if(Math.abs(a.length-b.length)>1) return false; var d=0,i=0,j=0; while(i<a.length&&j<b.length){ if(a[i]===b[j]){i++;j++;} else { d++; if(d>1) return false; if(a.length>b.length) i++; else if(b.length>a.length) j++; else {i++;j++;} } } return d+(a.length-i)+(b.length-j)<=1; }

var PRAISE=['정답이에요! 🎉','완벽해요! ✨','좋아요! 👏','훌륭해요! 🌟','바로 그거예요! 💪','멋져요! 🔥'];
function grade(ok, note, isSpeak){
  var ex=currentEx(); stopSpeak();
  var fb=document.getElementById('feedback');

    G.xp += gain;

    document.getElementById('fb-text').innerHTML = (note?esc(note)+'<br>':'')+'<span style="color:var(--yellow-d)">+'+gain+' XP</span>';

    document.getElementById('fb-text').innerHTML = (note?esc(note)+'<br>':'')+'정답: <span class="ans">'+esc(ansTxt)+'</span>';
    if(!G.practice && ex.type!=='match'){ G.queue.push(requeue(ex)); } // 틀린 문제는 뒤에서 다시
  }

function requeue(ex){ // 같은 문장을 더 쉬운 유형으로 다시

  if(!sent) return ex;
  if(ex.type==='type'||ex.type==='listen') return exTiles(sent);

function finishLesson(failed){
  stopSpeak();
  var d = load(), prog = songProg(d), L = G.lesson;
  var total = G.correct + G.wrong; var acc = total ? Math.round(G.correct/total*100) : 0;
  var lvBefore = levelOf(d.xp);
  var newBadges = [];
  var bonus = 0;
  if(!failed){
    if(!G.practice){
      bonus += 10;
      var perfect = G.mistakes===0;
      if(perfect) bonus += 15;
      if(L.boss) bonus += 25;
      var prev = prog.done[L.id];
      prog.done[L.id] = { crown: (prev&&prev.crown) || perfect, best: Math.max(prev?prev.best:0, acc), times:(prev?prev.times:0)+1 };
      if(!d.badges.first){ d.badges.first=1; newBadges.push('first'); }
      if(perfect && !d.badges.perfect){ d.badges.perfect=1; newBadges.push('perfect'); }
      if(L.boss && !d.badges.boss){ d.badges.boss=1; newBadges.push('boss'); }
    }
    var earned = G.xp + bonus;
    d.xp += earned; prog.xp += earned;
    d.daily[today()] = (d.daily[today()]||0) + earned;
    // 연속일
    if(d.lastDay!==today()){ d.streak = (d.lastDay===yesterday()) ? d.streak+1 : 1; d.lastDay=today(); d.bestStreak=Math.max(d.bestStreak||0,d.streak); }
    if(d.streak>=3 && !d.badges.streak3){ d.badges.streak3=1; newBadges.push('streak3'); }
    if(d.xp>=300 && !d.badges.xp300){ d.badges.xp300=1; newBadges.push('xp300'); }
    if((d.spoken||0)>=5 && !d.badges.speaker){ d.badges.speaker=1; newBadges.push('speaker'); }
    save(d);
  }
  var lvAfter = levelOf(d.xp);
  // 결과 화면
  document.getElementById('r-emoji').textContent = failed ? '💔' : (G.practice ? '💪' : (G.mistakes===0 ? '👑' : '🎉'));
  document.getElementById('r-title').textContent = failed ? '하트가 다 떨어졌어요' : (G.practice ? '연습 완료!' : (L.boss ? '보스 클리어!' : (G.mistakes===0 ? '퍼펙트 레슨!' : '레슨 완료!')));
  document.getElementById('r-title').style.color = failed ? 'var(--red)' : 'var(--yellow-d)';
  document.getElementById('r-sub').textContent = failed ? '괜찮아요. 틀린 문장을 다시 보고 한 번 더 도전해요!' : (G.mistakes===0 ? '실수 하나 없이 끝냈어요. 왕관을 받았어요!' : (bonus?'완료 보너스 +'+bonus+' XP 포함':'틈틈이 연습하면 오래 기억돼요'));
  document.getElementById('r-xp').textContent = failed ? '+0' : '+'+(G.xp+bonus);
  document.getElementById('r-acc').textContent = acc+'%';
  document.getElementById('r-streak').textContent = d.streak+'일';
  document.getElementById('r-retry').textContent = failed ? '다시 도전' : '다시 풀기';
  go('result');
  // 레벨업 / 배지 모달
  var modals = [];
  if(lvAfter>lvBefore) modals.push(['🏅','레벨 업! Lv.'+(lvAfter+1)+' '+LEVELS[lvAfter].name, LEVELS[lvAfter].icon+' '+LEVELS[lvAfter].name+' 단계에 도달했어요. 다음 레벨까지 '+((LEVELS[lvAfter+1]?LEVELS[lvAfter+1].xp-d.xp:0))+' XP!']);
  newBadges.forEach(function(id){ var b=BADGES.filter(function(x){ return x.id===id; })[0]; modals.push([b.icon,'새 배지: '+b.name, b.desc]); });
  (function showNext(){ if(!modals.length) return; var m=modals.shift(); showModal(m[0],m[1],m[2],'좋아요!',false,showNext); })();
}

/* Flashcards are stored per song and direction, independently of lesson XP. */
const FlashReview = (() => {
  const song = LESSON_DATA.song;
  const storageKey = 'gmp_flash_v1:' + song.id;
  const cards = [
    ...LESSON_DATA.sentences.map(s => ({...s, key:'mission/' + s.id, group:'mission'})),
    ...LESSON_DATA.examples.map(s => ({...s, key:'work/' + s.id, group:'work'})),
    ...LESSON_DATA.vocab.map(v => ({...v, key:'word/' + v.en, group:'word', tip:v.pron ? '발음  ' + v.pron : ''}))
  ];
  const byKey = new Map(cards.map(c => [c.key, c]));
  const labels = {mission:'미션 문장', work:'실무 회화', word:'핵심 어휘', again:'다시 볼 카드'};
  const shortLabels = {mission:'미션', work:'실무', word:'어휘', again:'다시 볼'};
  const get = id => document.getElementById('fc-' + id);
  const screen = document.getElementById('scr-flash');
  let flipped = false;
  let stamp = '';
  let state = read();
  function read() {
    let saved;
    try { saved = JSON.parse(localStorage.getItem(storageKey)); } catch {}
    const obj = value => value && typeof value === 'object' && !Array.isArray(value);
    return {
      direction: saved?.direction === 'ko' ? 'ko' : 'en',
      deck: Object.hasOwn(labels, saved?.deck) ? saved.deck : 'mission',
      marks: obj(saved?.marks) ? saved.marks : {},
      rounds: obj(saved?.rounds) ? saved.rounds : {}
    };
  }
  function persist() {
    try { localStorage.setItem(storageKey, JSON.stringify(state)); }
    catch { get('storage').hidden = false; }
  }
  const mark = c => state.marks[state.direction + '/' + c.key];
  const pool = group => cards.filter(c => group === 'again' ? mark(c) === 'again' : c.group === group);
  const roundKey = () => state.direction + '/' + state.deck;
  function round(restart=false) {
    const key = roundKey();
    let r = state.rounds[key];
    if (restart || !r || !Array.isArray(r.ids) || !r.ids.every(id => byKey.has(id)) ||
        !Number.isInteger(r.known) || r.known < 0 || r.known > r.index ||
        !Number.isInteger(r.index) || r.index < 0 || r.index > r.ids.length) {
      r = {ids:pool(state.deck).map(c => c.key), index:0, known:0};
      state.rounds[key] = r;
    }
    return r;
  }
  function select(group, direction) {
    stopSpeak();
    state.deck = group;
    state.direction = direction;
    if (group === 'again') round(true);
    flipped = false;
    persist();
    render();
  }
  function render() {
    const r = round();
    const current = byKey.get(r.ids[r.index]);
    const weak = pool('again').length;
    get('total').textContent = cards.length + '장';
    get('song').textContent = song.title + ' · ' + song.artist;
    screen.querySelectorAll('[data-deck]').forEach(b => {
      const count = pool(b.dataset.deck).length;
      b.textContent = shortLabels[b.dataset.deck] + ' ' + count;
      b.setAttribute('aria-label', labels[b.dataset.deck] + ' ' + count + '장');
      b.setAttribute('aria-pressed', String(b.dataset.deck === state.deck));
    });
    screen.querySelectorAll('[data-direction]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.direction === state.direction)));
    get('status').textContent = '이 방향에서 기억한 카드 ' + cards.filter(c => mark(c) === 'known').length + '장 · 다시 볼 카드 ' + weak + '장';
    get('study').hidden = !current;
    get('end').hidden = !!current;
    stamp = roundKey() + '/' + r.index + '/' + (current?.key || '');
    if (!current) {
      const empty = !r.ids.length;
      get('heading').textContent = empty ? '다시 볼 카드가 없습니다' : labels[state.deck] + ' 복습 완료';
      get('message').textContent = empty ? '답을 본 뒤 ‘다시 볼래요’를 누른 카드가 여기에 모입니다.' :
        '이번 ' + r.ids.length + '장 중 ' + r.known + '장을 기억했어요.';
      get('retry').hidden = !weak || empty;
      get('restart').textContent = state.deck === 'again' ? '미션 문장으로' : '이 묶음 다시 보기';
      return;
    }
    const lang = flipped ? (state.direction === 'en' ? 'ko' : 'en') : state.direction;
    get('deck-name').textContent = labels[state.deck];
    get('position').textContent = (r.index + 1) + ' / ' + r.ids.length;
    get('progress').max = r.ids.length;
    get('progress').value = r.index;
    get('label').textContent = flipped ? current[state.direction] : lang === 'en' ? '영어를 보고 뜻을 떠올려 보세요' : '한국어를 보고 영어로 말해 보세요';
    get('word').lang = lang;
    get('word').textContent = current[lang];
    get('tip').hidden = !flipped || !current.tip;
    get('tip').textContent = flipped ? current.tip || '' : '';
    get('flip').textContent = flipped ? '↶  앞면 보기' : '↻  눌러서 정답 확인';
    get('card').classList.toggle('answer', flipped);
    get('card').setAttribute('aria-expanded', String(flipped));
    get('grade').hidden = !flipped;
    get('audio').hidden = state.direction === 'ko' && !flipped;
    get('audio').disabled = !synth;
    get('audio').textContent = synth ? '♪ 영어 듣기' : '음성 재생 미지원';
  }
  function rate(outcome) {
    const r = round();
    const id = r.ids[r.index];
    if (!flipped || !id || stamp !== roundKey() + '/' + r.index + '/' + id) return;
    stopSpeak();
    state.marks[state.direction + '/' + id] = outcome;
    if (outcome === 'known') r.known += 1;
    r.index += 1;
    // A missed-only list must reflect grades given in the other decks.
    if (state.deck !== 'again') delete state.rounds[state.direction + '/again'];
    flipped = false;
    persist();
    render();
    (get('study').hidden ? get('heading') : get('card')).focus({preventScroll:true});
  }
  screen.querySelectorAll('[data-deck]').forEach(b => b.addEventListener('click', () => select(b.dataset.deck, state.direction)));
  screen.querySelectorAll('[data-direction]').forEach(b => b.addEventListener('click', () => select(state.deck, b.dataset.direction)));
  get('card').addEventListener('click', () => {
    flipped = !flipped;
    render();
    const card = get('card');
    card.classList.remove('turning');
    void card.offsetWidth;
    card.classList.add('turning');
  });
  get('again').addEventListener('click', () => rate('again'));
  get('known').addEventListener('click', () => rate('known'));
  get('audio').addEventListener('click', () => {
    const r = round();
    const c = byKey.get(r.ids[r.index]);
    if (c) speak(c.en, 0.9);
  });
  get('retry').addEventListener('click', () => select('again', state.direction));
  get('restart').addEventListener('click', () => {
    if (state.deck === 'again') { select('mission', state.direction); return; }
    round(true);
    flipped = false;
    persist();
    render();
    get('card').focus();
  });
  window.addEventListener('storage', e => {
    if (e.key !== storageKey) return;
    state = read();
    flipped = false;
    if (screen.classList.contains('active')) render();
  });
  return { open() { flipped = false; render(); } };
})();

/* 시작 */
if(location.hash==='#flashcards') go('flash'); else renderPath();

<script>
/* ===== 안드로이드 음성 호환 보정 (GMP TTS FIX v2) =====
   아이폰에서는 나던 소리가 안드로이드(삼성)에서 안 나는 원인을 보정한다.
   카드의 기존 함수는 그대로 두고 speechSynthesis 자체를 감싼다.
   v2: 네이버·카카오 같은 앱 안 브라우저에서 열리면 크롬·삼성 인터넷·엣지로 여는 안내를 띄운다. */
(function(){
  if(window.__gmpTtsFix) return;
  window.__gmpTtsFix = true;

  /* --- 0. 앱 안 브라우저 안내 ---
     블로그 독자는 대부분 네이버 앱 안에서 카드 링크를 누른다.
     안드로이드의 앱 안 브라우저(WebView)는 음성 합성을 지원하지 않거나
     목소리 목록이 비어 있어, 버튼을 눌러도 아무 소리가 나지 않는다. */
  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isKakao = /KAKAOTALK/i.test(ua);
  var isInApp = isAndroid && (isKakao || /NAVER\(inapp|DaumApps|Instagram|FBAN|FBAV|Line\/|everytimeApp|; wv\)/i.test(ua));
  var banner = null;

  /* 안드로이드 intent 주소로 지정한 브라우저 앱에서 같은 페이지를 연다.
     그 브라우저가 설치돼 있지 않으면 플레이 스토어 설치 화면으로 보낸다. */
  var BROWSERS = {
    chrome:  'com.android.chrome',
    samsung: 'com.sec.android.app.sbrowser',
    edge:    'com.microsoft.emmx'
  };
  function openIn(key){
    var url = location.href;
    var pkg = BROWSERS[key];
    location.href = 'intent://' + url.replace(/^https?:\/\//, '')
      + '#Intent;scheme=' + (location.protocol === 'http:' ? 'http' : 'https')
      + ';action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE'
      + ';package=' + pkg
      + ';S.browser_fallback_url=' + encodeURIComponent('https://play.google.com/store/apps/details?id=' + pkg)
      + ';end';
  }
  function copyUrl(btn){
    var url = location.href;
    function ok(){ btn.textContent = '복사됨'; }
    try {
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(ok, function(){ prompt('주소를 복사해 다른 브라우저에 붙여 넣으세요', url); });
        return;
      }
    } catch(e){}
    prompt('주소를 복사해 다른 브라우저에 붙여 넣으세요', url);
  }
  function showBanner(kind){
    if(banner || !document.body) return;
    banner = document.createElement('div');
    banner.setAttribute('role','status');
    banner.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;'
      + 'background:#3A2317;color:#FFF3E4;border-radius:12px;padding:13px 15px;'
      + 'font:14px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;'
      + 'box-shadow:0 6px 24px rgba(0,0,0,.3);max-width:520px;margin:0 auto';
    var btn = 'border:0;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;';
    var msg;
    if(kind === 'voice'){
      msg = '🔇 <b>이 기기에 영어 음성이 없어 소리가 나지 않습니다.</b><br>'
        + '설정 → 일반 → <b>접근성 → 텍스트 음성 변환</b>에서 '
        + '<b>Google 음성 인식 및 합성</b>을 선택하고, 언어에 <b>English</b>를 내려받아 주세요.';
    } else {
      msg = '🔇 <b>앱 안에서 열면 발음 소리가 나지 않을 수 있어요.</b><br>'
        + '아래 브라우저 중 하나로 열면 소리가 납니다. 안 열리면 주소를 복사해 붙여 넣으세요.';
    }
    var open = 'background:#F2A541;color:#3A2317;';
    banner.innerHTML = msg
      + '<div style="display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;margin-top:9px">'
      + (kind === 'voice' ? '' :
         '<button data-act="chrome" style="' + btn + open + '">크롬</button>'
       + '<button data-act="samsung" style="' + btn + open + '">삼성 인터넷</button>'
       + '<button data-act="edge" style="' + btn + open + '">엣지</button>'
       + '<button data-act="copy" style="' + btn + 'background:#5A3D2B;color:#FFF3E4">주소 복사</button>')
      + '<button data-act="close" style="' + btn + 'background:#FFF3E4;color:#3A2317">닫기</button></div>';
    banner.addEventListener('click', function(ev){
      var act = ev.target && ev.target.getAttribute && ev.target.getAttribute('data-act');
      if(BROWSERS[act]) openIn(act);
      else if(act === 'copy') copyUrl(ev.target);
      else if(act === 'close'){ banner.remove(); }
    });
    document.body.appendChild(banner);
  }
  function whenReady(fn){
    if(document.body) fn();
    else document.addEventListener('DOMContentLoaded', fn);
  }
  if(isInApp || (isAndroid && !window.speechSynthesis)){
    whenReady(function(){ showBanner('inapp'); });
  }
  if(!window.speechSynthesis) return;

  var synth = window.speechSynthesis;
  var rawSpeak  = synth.speak.bind(synth);
  var rawCancel = synth.cancel.bind(synth);

  var lastCancel = 0;
  var voices = [];
  var warned = false;
  var keepAlive = null;

  /* --- 1. 목소리 목록 캐싱 ---
     안드로이드 크롬은 getVoices()가 처음엔 빈 배열을 준다. */
  function loadVoices(){
    try { var v = synth.getVoices(); if(v && v.length) voices = v; } catch(e){}
  }
  loadVoices();
  try { synth.addEventListener('voiceschanged', loadVoices); } catch(e){
    synth.onvoiceschanged = loadVoices;
  }
  setTimeout(loadVoices, 300);
  setTimeout(loadVoices, 1200);
  setTimeout(checkEnglish, 2500);

  function englishVoices(){
    return voices.filter(function(v){ return v.lang && v.lang.toLowerCase().indexOf('en') === 0; });
  }

  /* 카드는 여성 영어 음성을 기준으로 만들어졌다.
     보정이 개입할 때도 같은 결을 유지해야 학습 자료가 들쭉날쭉해지지 않는다. */
  var FEMALE = ['samantha','victoria','allison','ava','susan','zira','aria','jenny',
    'michelle','joanna','salli','kendra','kimberly','google us english','karen','moira',
    'tessa','fiona','serena','female','woman','zoe','nicky','vicki','eddy','flo'];
  var MALE = ['albert','bad news','bahh','bells','boing','bubbles','cellos','david',
    'mark','alex','daniel','fred','male','man','guy','tom','george','james','oliver',
    'arthur','microsoft david','junior','ralph','organ','trinoids','whisper','wobble',
    'jester','superstar','grandpa','rocko','reed','sandy','shelley','good news'];
  function nameHas(v, list){
    var n = (v.name || '').toLowerCase();
    return list.some(function(k){ return n.indexOf(k) >= 0; });
  }
  function bestEnglish(){
    var en = englishVoices();
    if(!en.length) return null;
    var us = en.filter(function(v){ return v.lang === 'en-US'; });
    var pool = us.length ? us : en;
    return pool.filter(function(v){ return nameHas(v, FEMALE); })[0]
        || pool.filter(function(v){ return !nameHas(v, MALE); })[0]
        || pool[0];
  }

  /* --- 2. 영어 목소리가 아예 없으면 알려준다 ---
     삼성 기기에서 구글 TTS 영어 데이터가 없으면 소리가 안 난다.
     이때는 조용히 실패하지 말고 무엇을 해야 하는지 보여 준다. */
  function checkEnglish(){
    if(warned || !voices.length) return;
    if(englishVoices().length) return;
    warned = true;
    showBanner('voice');
  }

  /* --- 3. 안드로이드 크롬은 재생 중 스스로 멈추는 버그가 있다 --- */
  function startKeepAlive(){
    if(keepAlive) return;
    keepAlive = setInterval(function(){
      if(!synth.speaking){ stopKeepAlive(); return; }
      if(synth.paused){ try { synth.resume(); } catch(e){} }
    }, 3000);
  }
  function stopKeepAlive(){
    if(keepAlive){ clearInterval(keepAlive); keepAlive = null; }
  }

  /* --- 4. cancel() 시각을 기록한다 ---
     cancel() 직후 같은 순간에 speak()를 부르면 안드로이드는 그 발화를 조용히 버린다.
     아이폰은 버리지 않기 때문에 아이폰에서만 소리가 났던 것이다. */
  synth.cancel = function(){
    lastCancel = Date.now();
    stopKeepAlive();
    return rawCancel();
  };

  /* --- 5. 발화 보정 후 재생 --- */
  function fixUtterance(u){
    // 영어 문장인데 한국어 목소리가 붙으면 안드로이드는 발음하지 못한다.
    var wantEn = !u.lang || u.lang.toLowerCase().indexOf('en') === 0;
    if(wantEn){
      var bad = u.voice && u.voice.lang && u.voice.lang.toLowerCase().indexOf('en') !== 0;
      if(bad) u.voice = null;
      if(!u.voice){
        var pick = bestEnglish();
        if(pick){ u.voice = pick; u.lang = pick.lang; }
      }
      if(!u.lang) u.lang = 'en-US';
    }
    // 일부 안드로이드 TTS는 극단적인 속도를 무시하거나 무음으로 처리한다
    if(typeof u.rate === 'number'){
      if(u.rate < 0.5) u.rate = 0.5;
      if(u.rate > 1.8) u.rate = 1.8;
    }
    return u;
  }

  synth.speak = function(u){
    if(!u) return;
    fixUtterance(u);

    // onend가 끝내 오지 않아도 다음 단계로 넘어가게 한다 (3단계 연속 듣기 대비)
    var done = false;
    var userEnd = u.onend;
    var userErr = u.onerror;
    function finish(ev){
      if(done) return;
      done = true;
      stopKeepAlive();
      if(typeof userEnd === 'function'){ try { userEnd.call(u, ev || {}); } catch(e){} }
    }
    u.onend = function(ev){ finish(ev); };
    u.onerror = function(ev){
      if(done) return;
      done = true;
      stopKeepAlive();
      if(typeof userErr === 'function'){ try { userErr.call(u, ev); } catch(e){} }
      else if(typeof userEnd === 'function'){ try { userEnd.call(u, ev); } catch(e){} }
    };

    // 안드로이드에서 소리가 시작되지 않고 목소리 목록도 비어 있으면
    // 앱 안 브라우저처럼 음성을 낼 수 없는 환경이다. 이때 크롬 안내를 띄운다.
    var started = false;
    var userStart = u.onstart;
    u.onstart = function(ev){
      started = true;
      if(typeof userStart === 'function'){ try { userStart.call(u, ev); } catch(e){} }
    };
    if(isAndroid && String(u.text || '').trim()){
      setTimeout(function(){
        if(!started && !voices.length) showBanner('inapp');
      }, 2500);
    }

    var words = String(u.text || '').split(/\s+/).length;
    var estimate = Math.max(2500, (words / Math.max(0.5, u.rate || 1)) * 700 + 2500);

    var wait = Math.max(0, 260 - (Date.now() - lastCancel));
    setTimeout(function(){
      loadVoices();
      if(!u.voice) fixUtterance(u);
      try { rawSpeak(u); } catch(e){ finish(); return; }
      startKeepAlive();
      setTimeout(function(){ if(!done && !synth.speaking) finish(); }, estimate);
    }, wait);
  };

  /* --- 6. 첫 터치에서 음성 엔진을 깨운다 ---
     일부 안드로이드 브라우저는 사용자 조작 없이는 음성 엔진을 준비하지 않는다. */
  function unlock(){
    loadVoices();
    try {
      var u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      rawSpeak(u);
    } catch(e){}
    document.removeEventListener('touchstart', unlock, true);
    document.removeEventListener('click', unlock, true);
  }
  document.addEventListener('touchstart', unlock, true);
  document.addEventListener('click', unlock, true);
})();

</script>
